name: refresh profile card

# Regenerates dark.svg / light.svg so uptime, metrics and the heatmap stay fresh.
# No push trigger: the bot's own commit must not re-run the workflow.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  refresh-card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: rebuild dark.svg / light.svg
        run: python scripts/build_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # public metrics + contribution calendar
          GH_PAT: ${{ secrets.GH_PAT }}                       # optional: include private repos
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}   # optional: coding hours per language
      - name: commit if the card changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg
          git diff --staged --quiet || git commit -m "chore: daily profile card refresh"
          git push
